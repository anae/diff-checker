services:
  diff-checker:
    build: .
    container_name: diff-checker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
